<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>ReturnWitness architecture</title>
  <desc>Pages in the browser call Next.js route handlers. The engine in app code reconciles, guards drafts, signs approval tokens and runs the state machine. Adapters reach the Meta Model API (SAM 3.1, Muse Spark 1.3, Muse Wonder 1.0), partner GPUs (Baseten for the open-weight auditor, Modal for SAM 3.1 failover and the Glimmer label reader), Stripe in test mode, and the case store. Models can hold money, never release it. A person decides.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111111"/></marker></defs>
  <rect width="1200" height="640" fill="#F4F3EF"/>
  <text x="40" y="54" font-size="28" font-weight="700" fill="#111111">Architecture</text>
  <text x="40" y="86" font-size="20" font-weight="700" fill="#B8000F">Models can hold money, never release it. A person decides.</text>
  <line x1="40" y1="106" x2="1160" y2="106" stroke="#111111" stroke-width="3"/>
  <g font-size="15" fill="#111111">
    <rect x="40" y="130" width="1120" height="78" fill="#FAFAF7" stroke="#111111" stroke-width="2"/>
    <text x="56" y="160" font-size="13" font-family="Menlo, Consolas, monospace" fill="#4F4F4F">BROWSER · NEXT.JS APP ROUTER PAGES</text>
    <text x="56" y="188" font-size="17">/  ·  /demo (Instant Demo)  ·  /play (return a box yourself, engine runs in the browser)  ·  /dashboard: queue, bench, held, refunds, evals, agents</text>

    <line x1="600" y1="210" x2="600" y2="238" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>
    <rect x="40" y="242" width="1120" height="70" fill="#FAFAF7" stroke="#111111" stroke-width="2"/>
    <text x="56" y="270" font-size="13" font-family="Menlo, Consolas, monospace" fill="#4F4F4F">ROUTE HANDLERS · app/api</text>
    <text x="56" y="296" font-size="17">POST /api/inspections (SSE stages)  ·  POST /api/cases/[id]/approve  ·  POST /api/cases/[id]/refund  ·  GET cases, evals, packet</text>

    <line x1="600" y1="314" x2="600" y2="342" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>
    <rect x="40" y="346" width="1120" height="92" fill="#111111"/>
    <text x="56" y="374" font-size="13" font-family="Menlo, Consolas, monospace" fill="#C9C6BE">ENGINE · APP CODE · lib/engine, lib/vision, lib/fleet</text>
    <text x="56" y="402" font-size="17" fill="#FAFAF7">tray counter  ·  reconcile vs slip + policy  ·  most-restrictive merge  ·  HELD-only draft guard</text>
    <text x="56" y="426" font-size="17" fill="#FAFAF7">state machine  ·  approval tokens (HMAC, single use, bound to the evidence digest)  ·  settlement</text>

    <line x1="180" y1="440" x2="180" y2="470" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>
    <line x1="480" y1="440" x2="480" y2="470" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>
    <line x1="780" y1="440" x2="780" y2="470" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>
    <line x1="1050" y1="440" x2="1050" y2="470" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>

    <rect x="40" y="474" width="280" height="130" fill="#FAFAF7" stroke="#111111" stroke-width="2"/>
    <text x="56" y="502" font-size="13" font-family="Menlo, Consolas, monospace" fill="#4F4F4F">META MODEL API · lib/meta</text>
    <text x="56" y="528">SAM 3.1: segment + track</text>
    <text x="56" y="550">Muse Spark 1.3: read evidence</text>
    <text x="56" y="572">Muse Wonder 1.0: draft, cite</text>
    <text x="56" y="594" fill="#4F4F4F">key stays off the public site</text>

    <rect x="340" y="474" width="280" height="130" fill="#FAFAF7" stroke="#111111" stroke-width="2"/>
    <text x="356" y="502" font-size="13" font-family="Menlo, Consolas, monospace" fill="#4F4F4F">META OPEN WEIGHTS · PARTNER GPUS</text>
    <text x="356" y="528">Baseten: Muse Spark Open auditor</text>
    <text x="356" y="550">Modal: SAM 3.1 failover</text>
    <text x="356" y="572">Modal: Muse Glimmer label reader</text>
    <text x="356" y="594" fill="#4F4F4F">can add a hold, never clear one</text>

    <rect x="640" y="474" width="280" height="130" fill="#FAFAF7" stroke="#111111" stroke-width="2"/>
    <text x="656" y="502" font-size="13" font-family="Menlo, Consolas, monospace" fill="#4F4F4F">STRIPE · lib/payments</text>
    <text x="656" y="528">test mode only (sk_test_)</text>
    <text x="656" y="550">refund only with a spent</text>
    <text x="656" y="572">single-use token</text>
    <text x="656" y="594" fill="#4F4F4F">no real funds move</text>

    <rect x="940" y="474" width="220" height="130" fill="#FAFAF7" stroke="#111111" stroke-width="2"/>
    <text x="956" y="502" font-size="13" font-family="Menlo, Consolas, monospace" fill="#4F4F4F">CASE STORE · lib/store</text>
    <text x="956" y="528">memory + file locally</text>
    <text x="956" y="550">Upstash Redis</text>
    <text x="956" y="572">when configured</text>
    <text x="956" y="594" fill="#4F4F4F">audit trail per case</text>
  </g>
</svg>
